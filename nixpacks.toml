[variables]
LD_LIBRARY_PATH = "/usr/lib/x86_64-linux-gnu:/usr/lib:/root/.nix-profile/lib"

[phases.setup]
nixPkgs = ["python312", "gcc"]
aptPkgs = ["libstdc++6"]

[phases.install]
cmds = [
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
